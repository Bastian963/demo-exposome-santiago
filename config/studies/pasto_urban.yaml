schema_version: 1
id: pasto_urban
location: co/pasto
hidden: false

# The DANE cabecera keeps the urban study separate from Pasto's extensive
# rural municipality and gives every provider one explicit AOI.
spatial:
  path: data/reference/co/pasto/pasto_urban/spatial_units.geojson
  id_column: unit_id
  name_column: unit_name
  unit_type: dane_cabecera_municipal
  expected_units: 1
  source: DANE Marco Geoestadistico Nacional 2024, layer 305 Zona Urbana, cabecera municipal DIVIPOLA 52001
  license: CC BY 4.0; attribute Departamento Administrativo Nacional de Estadistica - DANE (www.dane.gov.co)

period: {start_date: "2015-01-01", end_date: "2024-12-31"}

detail:
  native_study: pasto_native

# Dynamic World has documented, deterministic gaps for Pasto's urban AOI in
# 2016 and 2019.  Keep them in expected_years so the published green series is
# visibly incomplete and stays preview-only; do not interpolate or retry them.
temporal_exceptions:
  - layer_id: greenspace_multisource
    indicator: green
    years: [2016, 2019]
    reason: >-
      Dynamic World (composite Oct-Mar) returned no valid zonal green/tree/grass
      values for Pasto cabecera in 2016, and no available image bands for the
      same AOI/season in 2019. Observed in the 2026-08-21 resumable collection;
      the other configured years are complete. These are provider coverage gaps,
      not values to interpolate or retry.
    doc: docs/greenspace_multisource_methodology.md#limitations

layers: [pm25, air_quality_satellite, alan, greenspace_coverage, greenspace_multisource, precipitation, climate_heat, wind, wildfire, greenspace_access, walkability, social_infrastructure, food_environment, healthcare]
layer_overrides:
  greenspace:
    access:
      osm_extract: data/raw/geofabrik/colombia/260819/colombia.osm.pbf
  food_environment:
    osm_extract: data/raw/geofabrik/colombia/260819/colombia.osm.pbf
  healthcare:
    osm_extract: data/raw/geofabrik/colombia/260819/colombia.osm.pbf
  social_infrastructure:
    osm_extract: data/raw/geofabrik/colombia/260819/colombia.osm.pbf
  walkability:
    osm_extract: data/raw/geofabrik/colombia/260819/colombia.osm.pbf

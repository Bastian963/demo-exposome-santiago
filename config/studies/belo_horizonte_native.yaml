schema_version: 1
id: belo_horizonte_native
location: br/belo_horizonte
mode: native
hidden: true

# Native runners dissolve the same verified RMBH municipal polygons; the
# administrative limits clip the AOI but never create raster pixels.
aoi:
  path: data/reference/br/belo_horizonte/belo_horizonte_rmbh/spatial_units.geojson
  source: Dissolve of the 34 official RMBH municipal polygons
  license: same as belo_horizonte_rmbh

period:
  start_date: "2015-01-01"
  end_date: "2024-12-31"

layers:
  - air_quality_pm25
  - air_quality_satellite
  - alan
  - greenspace_coverage
  - greenspace_multisource
  - precipitation
  - climate_heat
  - wind
  - wildfire
  - greenspace_access
  - walkability
  - social_infrastructure
  - food_environment
  - healthcare

layer_overrides:
  greenspace:
    access:
      osm_extract: data/raw/geofabrik/sudeste/260819/sudeste.osm.pbf
  food_environment:
    osm_extract: data/raw/geofabrik/sudeste/260819/sudeste.osm.pbf
  healthcare:
    osm_extract: data/raw/geofabrik/sudeste/260819/sudeste.osm.pbf
  social_infrastructure:
    osm_extract: data/raw/geofabrik/sudeste/260819/sudeste.osm.pbf
  walkability:
    osm_extract: data/raw/geofabrik/sudeste/260819/sudeste.osm.pbf

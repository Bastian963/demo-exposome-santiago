# Declarative catalog for multi-country exposome studies.
#
# The 25 entries tracked by docs/exposome_status.csv are preserved.  The
# Chilean food_insecurity layer is included as entry 26 because it is the
# canonical example of a country-specific source and is already in the master.
version: 1

aliases:
  pm25: air_quality_pm25

# Phase-one portable pilot: seven global rasters/services plus five OSM layers.
pilot_layers:
  - air_quality_pm25
  - alan
  - greenspace_coverage
  - greenspace_multisource
  - precipitation
  - climate_heat
  - wind
  - wildfire
  - greenspace_access
  - walkability
  - social_infrastructure
  - food_environment
  - healthcare

layers:
  community_safety:
    title: Registered property-crime context
    category: social
    countries: [AR]
    provider: Argentina DNEC SAT Propiedad and INDEC population estimates
    command: [scripts/run_community_safety.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    master:
      include: true
      required_columns: [crime_property_rate_100k, crime_robbery_rate_100k, crime_theft_rate_100k, crime_vehicle_rate_100k, crime_public_space_pct, crime_firearm_pct]
      optional_prefixes: [crime_property_rate_100k_, crime_robbery_rate_100k_, crime_theft_rate_100k_, crime_vehicle_rate_100k_, crime_public_space_pct_, crime_firearm_pct_]

  community_violence:
    title: Registered community-violence context
    category: social
    countries: [AR]
    provider: Argentina DNEC SNIC departments and INDEC population estimates
    command: [scripts/run_community_violence.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    master:
      include: true
      optional_layer: true
      required_columns: [violence_homicide_victim_rate_100k, violence_attempted_homicide_victim_rate_100k, violence_intentional_injury_victim_rate_100k, violence_sexual_victim_rate_100k, violence_aggravated_robbery_event_rate_100k]
      optional_prefixes: [violence_]

  suicide_mortality:
    title: Suicide mortality comparator
    category: comparator
    countries: [AR]
    provider: Argentina DNEC SAT Suicidios and INDEC population estimates
    command: [scripts/run_argentina_outcomes.py, --outcome, suicide_mortality, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    master:
      include: false
      required_columns: [suicide_death_count, suicide_mortality_rate_100k]

  road_traffic_mortality:
    title: Road-traffic mortality comparator
    category: comparator
    countries: [AR]
    provider: Argentina DNEC SAT Muertes Viales and INDEC population estimates
    command: [scripts/run_argentina_outcomes.py, --outcome, road_traffic_mortality, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    master:
      include: false
      required_columns: [road_traffic_death_count, road_traffic_mortality_rate_100k]

  socioeconomic:
    title: Socioeconomic position
    category: CL
    countries: [CL]
    provider: CASEN/MDSF, INE Census, CEAD, PAES, FONASA and SINIM
    command: [scripts/run_socioeconomic.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [network]
    master:
      include: true
      required_columns: [poblacion, ingreso, escolaridad, pobreza_pct, pobreza_ci_low, pobreza_ci_high, pobreza_multi_pct, viv_materialidad_deficitaria_pct, hacinamiento_phh, nse_index, nse_index_pca, nse_quintil]
      optional_columns: [tasa_delitos_violentos, tasa_delitos_propiedad, paes_puntaje_promedio, pct_fonasa_tramo_a_b, ipp_per_capita]

  air_quality:
    title: Legacy coarse air quality
    category: global
    provider: CAMS via Open-Meteo Air Quality API
    native_resolution_m: 11000
    command: [scripts/run_air_quality.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [network]
    master:
      include: true
      required_columns: [n_grid, no2_who_ratio]

  air_quality_pm25:
    title: Chronic surface PM2.5
    category: global
    provider: ACAG/van Donkelaar V6.GL.02 via Google Earth Engine
    native_resolution_m: 1113
    pilot: true
    command: [scripts/run_pm25.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [gee]
    master:
      include: true
      required_columns: [pm25_mean, pm25_pop_weighted, pm25_who_ratio]

  heavy_metals:
    title: Industrial heavy-metal emissions
    category: CL
    countries: [CL]
    provider: Chile RETC/MMA
    command: [scripts/run_heavy_metals.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [network]
    master:
      include: true
      optional_layer: true
      required_columns: [hm_pb_kg, hm_mn_kg, hm_as_kg, hm_cd_kg, hm_hg_kg, hm_pb_log, hm_as_log, n_sources, hm_index]

  air_quality_satellite:
    title: Satellite air quality
    category: global
    provider: Sentinel-5P, MODIS and ERA5 via Google Earth Engine
    # native_resolution_m is O3's resolution only (this layer bundles 4 bands
    # at 4 different native resolutions, each correctly matched at fetch/reduce
    # time): NO2 1113 m, O3 7000 m, AOD/Angstrom 3000 m, BLH ~30000 m (input).
    # See docs/resolution_manifest.md for the per-band table.
    native_resolution_m: 7000
    command: [scripts/run_air_quality_satellite.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [gee]
    master:
      include: true
      required_columns: [blh_mean, aod_mean, ae_470_550_mean, fine_mode_fraction_mean, o3_mean, no2_surface_ug_m3, no2_who_ratio]
      rename: {no2_who_ratio: no2_who_ratio_satellite}

  wind:
    title: Wind exposure
    category: global
    provider: ERA5-Land via Google Earth Engine
    native_resolution_m: 11132
    pilot: true
    command: [scripts/run_wind.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [gee]
    master:
      include: true
      optional_layer: true
      required_columns: [wind_u_mean, wind_v_mean, wind_speed_mean, wind_speed_max_p99, wind_calm_pct, wind_dir_prevailing, wind_u_mean_winter, wind_v_mean_winter, wind_speed_mean_winter, wind_speed_max_p99_winter, wind_calm_pct_winter, wind_dir_winter_mean, wind_u_mean_summer, wind_v_mean_summer, wind_speed_mean_summer, wind_speed_max_p99_summer, wind_calm_pct_summer, wind_dir_summer_mean]

  alan:
    title: Artificial light at night
    category: global
    provider: VIIRS DNB and WorldPop via Google Earth Engine
    native_resolution_m: 463.83
    pilot: true
    command: [scripts/run_alan.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [gee]
    master:
      include: true
      required_columns: [alan_radiance_mean, alan_radiance_median, alan_radiance_sd, alan_radiance_max, alan_radiance_pop_weighted]

  sleep_context:
    title: Sleep-circadian context
    category: derived
    provider: Derived exposome composite
    command: [scripts/run_sleep_context.py, --city, "{city}", --out-dir, "{out_dir}"]
    requirements:
      input_layers: [alan, climate_openmeteo, socioeconomic, demography]
      study_inputs: [master_csv]
    master:
      include: true
      optional_layer: true
      required_columns: [sleep_alan_log, sleep_tropical_nights_20c, sleep_summer_tmin_c, sleep_exposure_index, sleep_vulnerability_index, sleep_context_index]

  greenspace_access:
    title: Greenspace access
    category: OSM
    provider: OpenStreetMap
    analysis_resolution_m: 1000
    pilot: true
    command: [scripts/run_greenspace_access.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}", --figures-dir, "{figures_dir}"]
    requirements:
      capabilities: [network]
    master:
      include: true
      required_columns: [green_osm_km2, green_osm_pct, green_osm_n, dist_to_nearest_park_m, green_area_within_300m_km2, green_area_within_500m_km2, green_area_within_1000m_km2, green_count_within_300m, green_count_within_500m, green_count_within_1000m]
      rename: {green_osm_km2: green_km2, green_osm_pct: green_pct, green_osm_n: n_green}

  greenspace_coverage:
    title: Satellite greenspace coverage
    category: global
    provider: Landsat 8/9 Collection 2 via Google Earth Engine
    native_resolution_m: 30
    pilot: true
    command: [scripts/run_greenspace_coverage.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}", --figures-dir, "{figures_dir}"]
    requirements:
      capabilities: [gee]
    master:
      include: true
      required_columns: [ndvi_mean, ndvi_max, evi_mean, evi_max, green_cover_pct_ndvi, green_cover_pct_evi]

  greenspace_multisource:
    title: Multi-source greenspace (Dynamic World + Meta canopy)
    category: global
    provider: Dynamic World V1 (10 m) + Meta/WRI Canopy Height (1 m) via Google Earth Engine
    native_resolution_m: 10
    pilot: true
    command: [scripts/run_greenspace_multisource.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}", --figures-dir, "{figures_dir}"]
    requirements:
      capabilities: [gee]
    master:
      include: true
      required_columns: [green_total_pct, tree_pct, grass_pct, canopy_cover_pct, canopy_mean_height_m]

  healthcare:
    title: Healthcare access
    category: OSM
    provider: OpenStreetMap with optional national official provider
    analysis_resolution_m: 1000
    pilot: true
    command: [scripts/run_healthcare.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    # WARNING: this is NOT what keeps the Chilean DEIS registry out of non-CL
    # studies -- config/countries/<iso2>.yaml is. country_args is rendered into
    # `command`, and the default in-process adapter path never executes
    # `command` (see the `runner is subprocess.run` branch in layers.py); only
    # the script-parity seam does. It looked like a guard and was not, which is
    # how healthcare for pais_vasco_provincias downloaded Chilean data on
    # 2026-08-10. Kept because the script path is still exercised by
    # config/runner_parity.yaml.
    country_args:
      default: [--no-official]
      CL: []
    requirements:
      capabilities: [network]
      official_optional: true
    master:
      include: true
      required_columns: [n_total, n_public_total, n_private_total, n_hospital, n_hospital_public, n_hospital_private, n_clinic, n_clinic_public, n_clinic_private, n_primary_care, n_primary_care_public, n_primary_care_private, n_pharmacy, n_laboratory, n_laboratory_public, n_laboratory_private, n_dental, n_dental_public, n_dental_private, n_mental_health, n_mental_health_public, n_mental_health_private, density_per_km2, n_access_grid, mean_nearest_health_m, median_nearest_health_m, p90_nearest_health_m, mean_nearest_hospital_m, median_nearest_hospital_m, p90_nearest_hospital_m, mean_nearest_primary_care_m, median_nearest_primary_care_m, p90_nearest_primary_care_m]
      optional_columns: [mean_nearest_health_network_m, median_nearest_health_network_m, p90_nearest_health_network_m, mean_nearest_hospital_network_m, median_nearest_hospital_network_m, p90_nearest_hospital_network_m, mean_nearest_primary_care_network_m, median_nearest_primary_care_network_m, p90_nearest_primary_care_network_m]
      rename:
        n_total: health_n_total
        n_public_total: health_n_public_total
        n_private_total: health_n_private_total
        n_hospital: health_n_hospital
        n_hospital_public: health_n_hospital_public
        n_hospital_private: health_n_hospital_private
        n_clinic: health_n_clinic
        n_clinic_public: health_n_clinic_public
        n_clinic_private: health_n_clinic_private
        n_primary_care: health_n_primary_care
        n_primary_care_public: health_n_primary_care_public
        n_primary_care_private: health_n_primary_care_private
        n_pharmacy: health_n_pharmacy
        n_laboratory: health_n_laboratory
        n_laboratory_public: health_n_laboratory_public
        n_laboratory_private: health_n_laboratory_private
        n_dental: health_n_dental
        n_dental_public: health_n_dental_public
        n_dental_private: health_n_dental_private
        n_mental_health: health_n_mental_health
        n_mental_health_public: health_n_mental_health_public
        n_mental_health_private: health_n_mental_health_private
        density_per_km2: health_density_per_km2
        n_access_grid: health_n_access_grid

  demography:
    title: Population and age structure
    category: CL
    countries: [CL]
    provider: INE Chile Census 2017 manzana microdata
    command: [scripts/run_demography.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}", --figures-dir, "{figures_dir}"]
    requirements:
      capabilities: [network]
    master:
      include: true
      required_columns: [comuna_code, pop_total, pop_male, pop_female, pop_0_14, pop_15_64, pop_65_plus, pct_pop_0_14, pct_pop_15_64, pct_pop_65_plus]
      rename: {pop_total: demo_pop_total, pop_male: demo_pop_male, pop_female: demo_pop_female, pop_0_14: demo_pop_0_14, pop_15_64: demo_pop_15_64, pop_65_plus: demo_pop_65_plus, pct_pop_0_14: demo_pct_pop_0_14, pct_pop_15_64: demo_pct_pop_15_64, pct_pop_65_plus: demo_pct_pop_65_plus}

  climate_heat:
    title: Climate and heat exposure
    category: global
    provider: ERA5-Land Daily Aggregated via Google Earth Engine
    native_resolution_m: 11132
    pilot: true
    command: [scripts/run_climate_heat.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [gee]
    master:
      include: true
      required_columns: [tmean_annual_c, tmax_mean_annual_c, summer_tmax_mean_c, tmax_p95_c, tmax_abs_c, apparent_tmax_mean_c, hot_days_30c, hot_days_35c, apparent_hot_days_35c, tropical_nights_20c, precip_annual_mm, heat_exposure_index, urban_heat_anomaly_c, n_area_grid_points, nearest_climate_m, used_nearest_fallback, n_days]
      rename: {n_area_grid_points: climate_n_area_grid_points, nearest_climate_m: climate_nearest_point_m, used_nearest_fallback: climate_used_nearest_fallback, n_days: climate_n_days}

  climate_lst_ecostress:
    title: Land surface temperature (ECOSTRESS)
    category: global
    # The only non-Earth-Engine raster provider in the catalog.  GEE hosts
    # ECO_L2T_LSTE but has ingested only Los Angeles tiles, so Latin American
    # cities must come from NASA Earthdata directly.  Radiative skin
    # temperature: complements climate_heat (ERA5-Land 2 m air temperature at
    # 11132 m), never replaces it.  See docs/evaluacion_fuentes_nasa.md.
    provider: ECOSTRESS ECO_L2T_LSTE v002 via NASA Earthdata LP DAAC
    native_resolution_m: 70
    # Not a pilot layer yet: portability is unproven where cloud cover is
    # persistent.  Lima returns 76 granules for 2024 against Santiago's 324,
    # before any cloud masking.
    pilot: false
    command: [scripts/run_climate_lst_ecostress.py, --study, "{study}", --start, "2019-01-01", --end, "2026-01-01"]
    requirements:
      capabilities: [network, earthdata]
    master:
      # The runner emits a native COG plus per-granule/per-unit summaries.
      # A master-joinable table is a later step, once a period composite has
      # actually been produced and validated.
      include: false

  precipitation:
    title: Precipitation and rainfall extremes
    category: global
    provider: CHIRPS Daily via Google Earth Engine
    native_resolution_m: 5566
    pilot: true
    command: [scripts/run_precipitation.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [gee]
    master:
      include: true
      required_columns: [precip_annual_mean_mm, precip_annual_sd_mm, precip_annual_cv, precip_wet_days, precip_wet_day_pct, precip_heavy_days_10mm, precip_very_heavy_days_20mm, precip_rx1day_mm, precip_rx5day_mm, precip_cdd_days, precip_cwd_days, precip_intensity_wet_day_mm, precip_winter_mean_mm, precip_summer_mean_mm, precip_latest_year_mm, precip_latest_anomaly_mm, precip_latest_anomaly_pct, precip_extremes_index, precip_n_years, precip_n_days]

  precipitation_spi:
    title: Standardized precipitation drought indices
    category: derived
    provider: Derived from the CHIRPS daily archive
    command: [scripts/run_precipitation_spi.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}", --chirps-daily-csv, "{input_chirps_daily_csv}"]
    requirements:
      input_layers: [precipitation]
      study_inputs: [chirps_daily_csv]
    master:
      include: true
      required_columns: [drought_months_pct, drought_severe_months_pct, drought_max_duration_months, precip_trend_mm_per_decade, spi_12_latest, spi_3_mean, spi_3_std, spi_6_mean, spi_12_mean]

  climate_openmeteo:
    title: Annual and seasonal climate metrics
    category: derived
    provider: Derived from Open-Meteo daily archive
    command: [scripts/run_climate_metrics.py, --city, "{city}", --daily-csv, "{input_daily_csv}", --out-dir, "{out_dir}", --cache-dir, "{cache_dir}"]
    requirements:
      study_inputs: [daily_csv]
      # daily_csv doesn't need to exist yet at preflight time: run_climate_metrics.py
      # auto-fetches it from Open-Meteo (progress bar + per-commune resume) when missing.
      study_inputs_self_fetch: [daily_csv]
    master:
      include: true
      required_columns: [tmean_annual, tmax_mean_annual, tmin_mean_annual, tmean_summer, tmax_mean_summer, tmin_mean_summer, tmean_winter, tmax_mean_winter, tmin_mean_winter, hot_days_30c, hot_days_35c, tropical_nights_20c, frost_days, heat_wave_days, cold_spell_days, dtr_mean, dtr_p95, temp_monthly_sd, seasonal_amplitude, cdd_18, hdd_10, ehdd, tmax_p95, tmin_p05]
      rename: {tmean_annual: om_tmean_annual_c, tmax_mean_annual: om_tmax_mean_annual_c, tmin_mean_annual: om_tmin_mean_annual_c, tmean_summer: om_tmean_summer_c, tmax_mean_summer: om_tmax_mean_summer_c, tmin_mean_summer: om_tmin_mean_summer_c, tmean_winter: om_tmean_winter_c, tmax_mean_winter: om_tmax_mean_winter_c, tmin_mean_winter: om_tmin_mean_winter_c, hot_days_30c: om_hot_days_30c, hot_days_35c: om_hot_days_35c, tropical_nights_20c: om_tropical_nights_20c, frost_days: om_frost_days, heat_wave_days: om_heat_wave_days, cold_spell_days: om_cold_spell_days, dtr_mean: om_dtr_mean_c, dtr_p95: om_dtr_p95_c, temp_monthly_sd: om_temp_monthly_sd, seasonal_amplitude: om_seasonal_amplitude_c, cdd_18: om_cdd_18, hdd_10: om_hdd_10, ehdd: om_ehdd, tmax_p95: om_tmax_p95_c, tmin_p05: om_tmin_p05_c}

  wildfire:
    title: Wildfire exposure
    category: global
    provider: MODIS MCD64A1 and FIRMS via Google Earth Engine
    # native_resolution_m is FIRMS active_fire's resolution (the coarser of
    # the 2 bundled sources, used conservatively for the resolution_warning
    # heuristic). MCD64A1 burned_area is 500 m — that finer value is what
    # NATIVE_LAYER_SPECS["wildfire"] (src/exposome/native.py) actually uses
    # for the native-study GeoTIFF export scale. See config/layers/wildfire.yaml
    # for both scale_meters values and docs/resolution_manifest.md.
    native_resolution_m: 1000
    pilot: true
    command: [scripts/run_wildfire.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [gee]
      official_optional: true
    master:
      include: true
      required_columns: [fire_burned_area_km2_total, fire_burned_area_mean_annual_km2, fire_burned_pct_mean_annual, fire_burned_pct_max_year, fire_burn_years_count, fire_worst_year, fire_trend_km2_per_decade, fire_detections_total, fire_detections_per_km2, fire_detections_max_year, fire_brightness_max_k, fire_exposure_index]
      optional_columns: [fire_official_n_fires, fire_official_damaged_ha, fire_official_human_cause_pct]

  noise:
    title: Urban traffic noise
    category: CL
    countries: [CL]
    provider: Chile MMA Greater Santiago Urban noise map 2023
    command: [scripts/run_noise.py, --city, "{city}", --out-dir, "{out_dir}"]
    requirements: {}
    master:
      include: true
      optional_layer: true
      required_columns: [noise_ld_pop_exposed, noise_ld_pct_exposed, noise_ln_pop_exposed, noise_ln_pct_exposed, noise_combined_pct, noise_in_gsu_map]

  noise_spain:
    title: Strategic environmental noise (Spain)
    category: derived
    countries: [ES]
    provider: SICA/MITECO fourth-phase strategic noise maps (2022)
    command: [scripts/run_noise_spain.py, --study, "{study}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      study_inputs: [source_manifest]
    master:
      include: true
      required_columns: [noise_lden_band_mean_dba, noise_lden_ge55_area_km2, noise_lden_ge55_area_pct, noise_lden_ge65_area_pct, noise_agglomeration_count, noise_has_modelled_ge55]

  walkability:
    title: Walkability
    category: OSM
    provider: OpenStreetMap street network
    pilot: true
    command: [scripts/run_walkability.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [network]
    master:
      include: true
      optional_layer: true
      required_columns: [walk_intersection_density, walk_street_density_km_km2, walk_avg_street_length_m, walk_streets_per_node, walk_circuity, walk_n_nodes, walk_index]

  public_transport:
    title: Public transport access
    category: CL
    countries: [CL]
    provider: Santiago-specific interpretation of OpenStreetMap transit features
    analysis_resolution_m: 1000
    command: [scripts/run_public_transport.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [network]
    master:
      include: true
      optional_layer: true
      required_columns: [transit_n_bus_stops, transit_n_metro_stations, transit_n_rail_stations, transit_bus_density, transit_metro_density, transit_mean_dist_bus_m, transit_p90_dist_bus_m, transit_bus_coverage_300m, transit_bus_coverage_500m, transit_mean_dist_metro_m, transit_metro_coverage_1000m, transit_has_metro, transit_index]

  social_infrastructure:
    title: Social and cognitive infrastructure
    category: OSM
    provider: OpenStreetMap points of interest
    analysis_resolution_m: 1000
    pilot: true
    command: [scripts/run_social_infrastructure.py, --city, "{city}", --cache-dir, "{cache_dir}", --out-dir, "{out_dir}"]
    requirements:
      capabilities: [network, gee]
    master:
      include: true
      optional_layer: true

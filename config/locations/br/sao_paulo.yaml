schema_version: 1
id: sao_paulo
name: São Paulo
country: Brazil
country_code: BR
country_code3: BRA
timezone: America/Sao_Paulo

# Scope is the municipio de Sao Paulo (96 distritos), not the wider Regiao
# Metropolitana de Sao Paulo (~39 municipios) -- same city-vs-metro split as
# Medellin (medellin_comunas) vs Valle de Aburra (valle_aburra_municipios).
#
# bbox = total_bounds of the 96-distrito reference
# (data/reference/br/sao_paulo/sao_paulo_distritos/metadata.json,
# scripts/migrations/build_sao_paulo_distritos_reference.py) plus a ~0.1 deg
# margin -- same convention as config/locations/co/bogota.yaml,
# config/locations/mx/cdmx.yaml and config/locations/pe/lima.yaml.
bbox:
  west: -46.93
  south: -24.11
  east: -46.27
  north: -23.26

crs:
  geographic: EPSG:4326
  metric: auto

# Per-distrito Overpass region_query, same per-locality pattern as
# config/locations/pe/lima.yaml (50 entries) and config/locations/mx/cdmx.yaml
# (16 entries) -- a single combined "Sao Paulo, Brazil" query times out over
# this many localities (see src/exposome/greenspace_access.py
# fetch_green_areas docstring). Generated programmatically from
# data/reference/br/sao_paulo/sao_paulo_distritos/spatial_units.geojson's
# own nm_distrito_municipal spelling, title-cased from the source's ALL-CAPS
# and accent-stripped spelling (same data-quality artifact as Bogota/Lima's
# sources -- accents were NOT guessed back in, for the same reason: Nominatim's
# Spanish/Portuguese search is generally accent-insensitive). This list has
# NOT been individually verified with ox.geocode_to_gdf (offline config edit,
# out of scope) -- the per-locality retry/cache design in greenspace_access.py
# means any entry that fails to geocode fails alone, by name, in the run log.
#
# Highest-risk entry: "Se" (98 distritos' historic center; the accented
# original "Se" is short for "Se" i.e. "See/Cathedral" -- a 2-letter/short
# generic word with real ambiguity risk in Nominatim, flagged here rather
# than guessing an unverified alternate query string).
#
# At 96 entries this is nearly double CDMX's largest prior region_query list
# (16) and Lima's (50) -- healthcare.py passes the *whole* region_query list
# to a single ox.features_from_place() call per OSM tag (5 tags), unlike
# greenspace_access.py's per-entry loop; this may need its own timeout/
# resilience pass once this study actually runs (out of scope for this
# config-only onboarding pass).
region_query:
  - "Agua Rasa, Sao Paulo, Brazil"
  - "Alto De Pinheiros, Sao Paulo, Brazil"
  - "Anhanguera, Sao Paulo, Brazil"

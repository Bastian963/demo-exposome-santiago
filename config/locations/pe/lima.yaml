schema_version: 1
id: lima
name: Lima
country: Peru
country_code: PE
country_code3: PER
timezone: America/Lima

# Lima Metropolitana (Provincia de Lima, 43 distritos) + the Provincia
# Constitucional del Callao (7 distritos) are two separate top-level
# administrative entities in Peru, but the cohort lives across both and they
# form one contiguous metro area -- same reasoning buenos_aires_amba used to
# merge CABA + partido-level jurisdictions under one region_query list.
#
# A single combined "Lima, Peru" query was NOT used here: CDMX and AMBA both
# hit an Overpass ConnectionError/timeout with one combined query over that
# many localities (see src/exposome/greenspace_access.py fetch_green_areas
# docstring), so this goes straight to the per-distrito list pattern from
# the start instead of waiting to hit the same failure.
#
# Names come from data/reference/pe/lima/lima_distritos/spatial_units.geojson
# (IGN/IDEP "Limite Distrital", FUENTE=INEI), title-cased from the source's
# ALL-CAPS spelling. The source has NO accented vowels anywhere (only Ñ
# survives, e.g. "BREÑA") -- confirmed by scanning every district name for
# non-ASCII characters before writing this list, not assumed. Accents were
# NOT guessed back in (e.g. "San Martin de Porres" not "San Martín...",
# "Jesus Maria" not "Jesús María") to avoid introducing unverified spelling;
# Nominatim's Spanish search is generally accent-insensitive. Like CDMX's
# list, these 50 entries have NOT been individually verified with
# ox.geocode_to_gdf (that call hits Nominatim, out of scope for an offline
# config edit) -- the per-locality retry/cache design in
# greenspace_access.py means any entry that fails to geocode fails alone, by
# name, in the run log.
#
# One deliberate rename: UBIGEO 150101's official NOMBDIST is just "LIMA"
# (Cercado de Lima), which as a bare Nominatim query would very likely
# resolve to the whole metropolitan area/department node instead of the
# small central district polygon -- same class of problem AMBA solved with
# "Partido de Esteban Echeverría". Used the district's common alternate name
# "Cercado de Lima" instead, which is what OSM/Nominatim typically indexes
# this specific administrative boundary as.
region_query:
  - "Bellavista, Callao, Peru"
  - "Callao, Callao, Peru"
  - "Carmen de la Legua Reynoso, Callao, Peru"
  - "La Perla, Callao, Peru"
  - "La Punta, Callao, Peru"
  - "Mi Peru, Callao, Peru"
  - "Ventanilla, Callao, Peru"

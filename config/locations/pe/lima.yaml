# total_bounds of the 50-distrito reference
# (scripts/migrations/build_lima_distritos_reference.py,
# data/reference/pe/lima/lima_distritos/metadata.json) plus a ~0.1 deg
# margin -- same convention as config/locations/mx/cdmx.yaml and
# config/locations/ar/buenos_aires_amba.yaml.
bbox:
  west: -77.30
  south: -12.62
  east: -76.52
  north: -11.47


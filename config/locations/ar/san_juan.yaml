schema_version: 1
id: san_juan
name: San Juan
country: Argentina
country_code: AR
country_code3: ARG
timezone: America/Argentina/San_Juan

# Per-department list, same pattern as buenos_aires_amba/bogota/medellin/cdmx
# -- and for a stricter reason than "combined query over many places times
# out". A single "Provincia de San Juan, Argentina" string DOES geocode
# cleanly to one relation (verified with ox.geocode_to_gdf, bounds match the
# IGN departamentos reference to 4 decimals), but that doesn't matter:
# greenspace_access._unit_geometry_for_region splits each region_query entry
# on its first comma, normalizes it, and looks it up against this study's
# own spatial_units.geojson unit_name column to get a per-unit bbox for
# Overpass tiling. "provincia de san juan" matches none of the 19 department
# names, so with a single whole-province entry the lookup always misses and
# the code falls through to an untiled features_from_place() query over the
# entire ~89,000 km2 province -- which Overpass rejects outright (observed
# 2026-08-03: both overpass-api.de and overpass.kumi.systems failed
# immediately, not a timeout-after-partial-progress). Once the entry matches
# a unit name, the fetch uses that unit's own IGN polygon bbox
# (fetch_features_from_bbox_tiled), so Nominatim never geocodes these
# strings at all -- exact match against unit_name after normalization is
# what matters, not real-world geocodability. Verified mechanically for all
# 19 (scripts/migrations/build_san_juan_reference.py's unit_name spelling,
# via greenspace_access._normalise_unit_name) before committing this list.
region_query:
  - "Capital, San Juan, Argentina"
  - "Chimbas, San Juan, Argentina"
  - "Rawson, San Juan, Argentina"
  - "Rivadavia, San Juan, Argentina"
  - "Santa Lucía, San Juan, Argentina"
  - "Pocito, San Juan, Argentina"
  - "Albardón, San Juan, Argentina"
  - "Angaco, San Juan, Argentina"
  - "Calingasta, San Juan, Argentina"
  - "Caucete, San Juan, Argentina"
  - "Iglesia, San Juan, Argentina"
  - "Jáchal, San Juan, Argentina"
  - "9 de Julio, San Juan, Argentina"
  - "25 de Mayo, San Juan, Argentina"
  - "San Martín, San Juan, Argentina"
  - "Sarmiento, San Juan, Argentina"
  - "Ullum, San Juan, Argentina"
  - "Valle Fértil, San Juan, Argentina"
  - "Zonda, San Juan, Argentina"

# total_bounds of the 19-departamento IGN reference
# (scripts/migrations/build_san_juan_reference.py) plus a ~0.1 deg margin.
bbox:
  west: -70.67
  south: -32.73
  east: -66.56
  north: -28.29

crs:
  geographic: EPSG:4326
  metric: auto

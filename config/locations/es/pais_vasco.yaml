schema_version: 1
id: pais_vasco
name: País Vasco
country: España
country_code: ES
country_code3: ESP
timezone: Europe/Madrid

# Per-province list (only 3 units), same reasoning as
# config/locations/es/cataluna.yaml and config/locations/ar/san_juan.yaml:
# greenspace_access._unit_geometry_for_region matches each region_query
# entry against this study's own spatial_units.geojson unit_name column to
# get a per-unit bbox for Overpass tiling, rather than a single
# "País Vasco, España" string that would never match and would fall
# through to an untiled features_from_place() query. Verified mechanically
# against scripts/migrations/build_pais_vasco_reference.py's unit_name
# spelling (GISCO's NAME_LATN, via greenspace_access._normalise_unit_name)
# before committing this list.
region_query:
  - "Araba/Álava, País Vasco, España"
  - "Bizkaia, País Vasco, España"
  - "Gipuzkoa, País Vasco, España"

# total_bounds of the 3-province GISCO NUTS3 reference
# (scripts/migrations/build_pais_vasco_reference.py) plus a ~0.1 deg margin.
bbox:
  west: -3.55
  south: 42.37
  east: -1.63
  north: 43.56

crs:
  geographic: EPSG:4326
  metric: auto

# Santiago, Chile — config for exposome pipeline
name: santiago
country: Chile
region_query: "Región Metropolitana de Santiago, Chile"
admin_level: 8
expected_communes: 52

crs:
  metric: "EPSG:32719"
  geographic: "EPSG:4326"

bbox:
  # Rough bounding box for Región Metropolitana (WGS84)
  lat_min: -34.5
  lat_max: -32.9
  lon_min: -71.8
  lon_max: -69.8

outputs:
  base_dir: "data/processed"
  figures_dir: "figures"
  maps_dir: "maps"
  cache_dir: "cache"

air_quality:
  # Date range for satellite extraction (media anual)
  year: 2024
  start_date: "2024-01-01"
  end_date: "2024-12-31"

  # GEE collections
  collections:
    no2:
      id: "COPERNICUS/S5P/OFFL/L3_NO2"
      band: "tropospheric_NO2_column_number_density"
      scale_meters: 1113  # ~3.5 km at this latitude
      multiplier: 1.0e15  # convert to molecules/cm^2 (optional)
    aod:
      id: "MODIS/061/MCD19A2_GRANULES"
      band: "Optical_Depth_047"
      scale_meters: 3000  # ~3 km
      qa_band: "AOD_QA"
      # QA bits 0-1: 0=best, 1=good, 2=marginal, 3=bad
      # Keep best + good (<=1) to reduce gaps over Chile
      qa_mask_max: 1
      # MODIS AOD is stored scaled by 0.001
      scale_factor: 0.001

  # WHO guidelines 2021 (µg/m^3) — for ratios
  who_guidelines:
    pm25: 5.0
    no2: 10.0

climate:
  # Historical period for time-series analysis
  years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  start_date: "2015-01-01"
  end_date: "2024-12-31"

  # Seasons (Southern Hemisphere)
  seasons:
    summer: [12, 1, 2]
    autumn: [3, 4, 5]
    winter: [6, 7, 8]
    spring: [9, 10, 11]

  # GEE collections
  collections:
    era5land_daily:
      id: "ECMWF/ERA5_LAND/DAILY_AGGR"
      bands: ["temperature_2m", "temperature_2m_min", "temperature_2m_max",
              "dewpoint_temperature_2m", "total_precipitation_sum"]
      scale_meters: 9000  # ~9 km native
    modis_lst_day:
      id: "MODIS/061/MOD11A1"
      band: "LST_Day_1km"
      qa_band: "QC_Day"
      scale_meters: 1000
    modis_lst_night:
      id: "MODIS/061/MYD11A1"
      band: "LST_Night_1km"
      qa_band: "QC_Night"
      scale_meters: 1000
    landsat_lst:
      id: "LANDSAT/LC08/C02/T1_L2"
      band: "ST_B10"
      qa_band: "QA_PIXEL"
      scale_meters: 30
    chirps:
      id: "UCSB-CHG/CHIRPS/DAILY"
      band: "precipitation"
      scale_meters: 5566  # ~0.05 deg

  # Derived metrics thresholds
  thresholds:
    hot_day_c: 30
    very_hot_day_c: 35
    tropical_night_c: 20
    frost_day_c: 0
    heat_wave_percentile: 0.90
    cold_spell_percentile: 0.10
    heat_wave_min_days: 2
    cold_spell_min_days: 2
    cdd_base_c: 18
    hdd_base_c: 10

  # Downscaling
  downscaling:
    grid_resolution_m: 1000
    model_type: "lightgbm"
    target_variables: ["tmax", "tmin"]
    covariates:
      - elevation
      - built_up_fraction
      - tree_cover_fraction
      - ndvi_mean
      - distance_to_city_center
      - lat
      - lon

greenspace:
  # Satellite-based greenness (Sentinel-2)
  satellite:
    collection: "COPERNICUS/S2_SR_HARMONIZED"
    years: [2024]
    # Southern Hemisphere spring-summer: Oct-Mar, peak greenness, fewer clouds
    season_months: [10, 11, 12, 1, 2, 3]
    cloud_max_pct: 20
    ndvi_threshold: 0.20
    evi_threshold: 0.15
    scale_meters: 10

  # Accessibility metrics based on OpenStreetMap green areas
  access:
    osm_tags:
      leisure: ["park", "garden", "recreation_ground", "dog_park"]
      landuse: ["village_green", "recreation_ground"]
    buffers_m: [300, 500, 1000]
    # Street-network distances are more realistic but slower; default Euclidean
    use_network: false
    network_type: "walk"

  # High-resolution computer-vision validation (Esri World Imagery)
  cv:
    source: "esri_world_imagery"
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    zoom: 17
    tile_size: 256
    # "exg" = fast CPU (Excess Green + Otsu); "sam" = slow GPU (Segment Anything)
    method: "exg"
    samples_per_commune: 5
    min_blob_px: 10
    exg_min_threshold: 0.05
    sam_model: "vit_h"

healthcare:
  # OpenStreetMap tags used to fetch healthcare facilities.
  # osmnx combines keys with OR and values within a key with OR.
  osm_tags:
    amenity: ["hospital", "clinic", "pharmacy", "doctors", "health_post", "dentist"]
    healthcare: ["hospital", "clinic", "centre", "doctor", "pharmacy", "dentist", "laboratory"]

  # Normalized categories used for counts and distance summaries.
  # A facility belongs to a category if ANY of its rules match.
  categories:
    hospital:
      - tag: "amenity"
        values: ["hospital"]
      - tag: "healthcare"
        values: ["hospital"]
    clinic:
      - tag: "amenity"
        values: ["clinic"]
      - tag: "healthcare"
        values: ["clinic"]
    primary_care:
      - tag: "amenity"
        values: ["doctors", "health_post"]
      - tag: "healthcare"
        values: ["centre", "doctor"]
    pharmacy:
      - tag: "amenity"
        values: ["pharmacy"]
      - tag: "healthcare"
        values: ["pharmacy"]
    laboratory:
      - tag: "healthcare"
        values: ["laboratory"]
    dental:
      - tag: "amenity"
        values: ["dentist"]
      - tag: "healthcare"
        values: ["dentist"]
    mental_health:
      - tag: "healthcare"
        values: ["psychotherapist"]
    all_health:
      - tag: "amenity"
        values: ["hospital", "clinic", "pharmacy", "doctors", "health_post", "dentist"]
      - tag: "healthcare"
        values: ["hospital", "clinic", "centre", "doctor", "pharmacy", "dentist", "laboratory"]

  grid_spacing_m: 1000
  output_base: "santiago_healthcare_access"

  # Street-network accessibility (optional; slower but more realistic).
  network:
    enabled: false
    network_type: "walk"  # walk / drive / all
    graph_cache: "cache/santiago_walk_graph.graphml"
    max_snap_distance_m: 500  # ignore grid points whose nearest road node is farther

  # Official MINSAL/DEIS facility inventory.
  # OpenStreetMap is still used as a complement for pharmacies and for any
  # facilities not present in the official registry.
  official_source:
    enabled: true
    # CKAN API endpoint used to discover the latest CSV resource.
    ckan_package_url: "https://datos.gob.cl/api/3/action/package_show?id=establecimientos-de-salud-vigentes"
    # Fallback direct URL if CKAN discovery fails.
    csv_url: "https://datos.gob.cl/dataset/3bf4cf7c-f638-4735-9a01-f65faae4beca/resource/2c44d782-3365-44e3-aefb-2c8b8363a1bc/download/establecimientos_20260623.csv"
    # Raw CSV delimiter.
    csv_sep: ";"
    # Column mapping from the DEIS CSV to the pipeline schema.
    columns:
      name: "EstablecimientoGlosa"
      type: "TipoEstablecimientoGlosa"
      region: "RegionGlosa"
      commune: "ComunaGlosa"
      lat: "Latitud"
      lon: "Longitud"
      status: "EstadoFuncionamiento"
      system_type: "TipoSistemaSaludGlosa"
      dependency: "DependenciaAdministrativa"
      affiliation: "TipoPertenenciaEstabGlosa"
    # Region and status filters.
    region_filter: "Metropolitana de Santiago"
    # The status field contains values like "Vigente en Operación Habitual".
    # Filtering is done case-insensitively with substring matching.
    status_contains: "Vigente"
    # Mapping of DEIS facility types to the pipeline categories.
    type_mapping:
      hospital:
        - "Hospital"
      clinic:
        - "Clínica"
      primary_care:
        - "Centro de Salud Familiar (CESFAM)"
        - "Servicio de Atención Primaria de Urgencia (SAPU)"
        - "Servicio de Atención Primaria de Urgencia de Alta Resolutividad (SAR)"
        - "Consultorio General Urbano (CGU)"
        - "Consultorio General Rural (CGR)"
        - "Posta de Salud Rural (PSR)"
        - "Centro Comunitario de Salud Familiar (CECOSF)"
        - "Servicio de Urgencia Rural (SUR)"
      laboratory:
        - "Laboratorio Clínico"
      dental:
        - "Clínica Dental"
      mental_health:
        - "Centro Comunitario de Salud Mental (COSAM)"
    # Spatial conflation with OSM.
    conflation:
      buffer_m: 150
      # If the straight-line distance is below strict_buffer_m, the points are
      # considered the same facility regardless of name.
      strict_buffer_m: 50
      # Otherwise, a name fuzzy-match ratio (0-1) above this threshold is also
      # required. Uses difflib.SequenceMatcher.
      name_match_threshold: 0.5

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainlat-exposome"
version = "0.1.0"
description = "Config-driven exposome extraction and publication for Latin American studies"
requires-python = ">=3.12"
dependencies = [
  "pandas",
  "numpy",
  "geopandas",
  "shapely",
  "pyproj",
  "osmnx",
  "matplotlib",
  "requests",
  "scipy",
  "openpyxl",
  "xlrd",
  "pyyaml",
  "typer",
  "tqdm",
  "rasterio",
  "earthengine-api",
  "earthaccess",
  "geemap",
  "geedim",
  "rarfile",
  "folium",
  "openaq",
  "opencv-python-headless",
  "rasterstats",
  "rioxarray",
  "scikit-image",
  "segment-geospatial",
  "esda",
  "libpysal",
  "scikit-learn",
  "pyarrow",
  "statsmodels",
  "pyreadstat",
  "mercantile",
  "mapbox-vector-tile",
]

[project.optional-dependencies]
dev = [
  "ipykernel",
  "nbclient",
  "nbformat",
  "pytest",
  "ruff",
]
spatial = [
  "pymc>=6,<7",
  "arviz>=1,<2",
  "h5netcdf>=1,<2",
  "h5py>=3.11,<4",
]
global_surveys_docs = [
  "pymupdf4llm",
  "pyreadr>=0.5.6",
]

[project.scripts]
exposome = "exposome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
